name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: brew install shellcheck antidote eza fnm fzf direnv gh starship zoxide neovim zsh uv

      - name: Validate shell syntax and lint
        run: |
          bash -n bootstrap setup post-install doctor dev-volume
          shellcheck -s bash bootstrap setup post-install doctor dev-volume
          /opt/homebrew/bin/zsh -n dotfiles/.zprofile dotfiles/.zshrc dotfiles/.zsh_helpers.zsh

      - name: Validate helper command surface
        run: |
          /opt/homebrew/bin/zsh -fc '
            source dotfiles/.zsh_helpers.zsh
            [[ "$(alias ls)" == *"eza -l --icons=auto"* ]]
            [[ "${aliases[macsetup]}" == *HOME*.macsetup* ]]
            for helper in c ccd _resolve_fzf_colorscheme f v mkd o; do
              whence -w "$helper" >/dev/null
            done
            [[ "$(print -r -- "file with space" | f --filter="file with space")" == "file with space" ]]
          '

      - name: Validate exact Brewfile contract
        shell: bash
        run: |
          brew bundle list --file=Brewfile
          diff -u \
            <(printf '%s\n' antidote awscli bat bun cloudflared container curl devcontainer direnv eza fnm fzf gh git go neovim opencode openssl php starship uv watchman zoxide zsh | sort) \
            <(brew bundle list --formula --file=Brewfile | sort)
          diff -u \
            <(printf '%s\n' 1password 1password-cli antigravity chatgpt claude claude-code@latest codex cursor cursor-cli discord docker-desktop figma flux-app font-hack-nerd-font font-jetbrains-mono font-jetbrains-mono-nerd-font font-paper-mono font-zed-mono-nerd-font google-chrome@dev granola kitty leapp openlogi raycast session-manager-plugin slack spotify tailscale-app thebrowsercompany-dia vscodium warp zed | sort) \
            <(brew bundle list --cask --file=Brewfile | sort)

      - name: Validate Node LTS and Python post-install
        shell: bash
        run: |
          runtime_home="$(mktemp -d)"
          export HOME="$runtime_home" FNM_DIR="$runtime_home/.fnm" XDG_BIN_HOME="$runtime_home/.local/bin" XDG_DATA_HOME="$runtime_home/.local/share"
          ./post-install
          /opt/homebrew/bin/fnm exec --using=default node \
            -e 'if (!process.release.lts) process.exit(1)'
          "$HOME/.local/bin/python" -c 'import ctypes, lzma, readline, sqlite3, ssl'

      - name: Validate Starship configuration
        run: STARSHIP_CONFIG="$PWD/dotfiles/.config/starship.toml" starship print-config >/dev/null

      - name: Generate Antidote bundle
        shell: bash
        run: |
          plugin_home="$(mktemp -d)"
          /opt/homebrew/bin/zsh -fc 'source "$1"; antidote bundle < "$2" > "$3"' \
            macsetup \
            /opt/homebrew/opt/antidote/share/antidote/antidote.zsh \
            "$PWD/dotfiles/.zsh_plugins.txt" \
            "$plugin_home/.zsh_plugins.zsh"
          test -s "$plugin_home/.zsh_plugins.zsh"

      - name: Validate Neovim configuration
        run: XDG_CONFIG_HOME="$PWD/dotfiles/.config" /opt/homebrew/bin/nvim --headless '+qall'
